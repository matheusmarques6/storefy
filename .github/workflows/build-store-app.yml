# Gera e envia o app de uma loja (seção 7 do plano).
#
# Quem dispara é o painel, por `repository_dispatch`, quando o lojista clica em
# publicar e o checklist inteiro passa. O `client_payload` traz só
# identificadores: as credenciais vêm de `/api/internal/build`, autenticada,
# porque o payload de um dispatch fica visível para quem lê as execuções do
# repositório.
#
# O QUE PRECISA ESTAR CONFIGURADO NOS SEGREDOS DO REPOSITÓRIO:
#   STOREFY_API_URL    — base do painel, ex.: https://app.storefy.com.br
#   BUILD_API_SECRET   — o mesmo valor que está no ambiente do painel
#   EXPO_TOKEN         — token de robô da conta Expo da Storefy
#   EAS_WEBHOOK_SECRET — o mesmo valor que está no ambiente do painel
#   EXPO_OWNER         — conta ou organização dona dos projetos (opcional)
#
# Sem eles o workflow para no primeiro passo, com a mensagem dizendo qual falta
# — em vez de falhar vinte minutos depois, dentro do EAS.
#
# `EXPO_OWNER` é o único opcional, e é opcional porque a falta dele é BARULHENTA:
# num token de conta pessoal o EAS resolve sozinho, e num token que enxerga mais
# de uma organização ele para com a pergunta na tela. `EAS_WEBHOOK_SECRET` é
# obrigatório pelo motivo oposto: sem ele o projeto novo nasce sem webhook, o
# binário fica pronto e ninguém avisa — a tela do lojista diria "gerando" para
# sempre.

name: build-store-app

on:
  repository_dispatch:
    types: [storefy-build]

# Um build por loja e plataforma de cada vez. Dois em paralelo disputam o mesmo
# número de build na loja de aplicativos, e a Apple recusa o segundo — depois
# de gerar os dois.
concurrency:
  group: build-${{ github.event.client_payload.storeId }}-${{ github.event.client_payload.platform }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Conferir a configuração
        run: |
          faltando=""
          [ -n "${{ secrets.STOREFY_API_URL }}" ]    || faltando="$faltando STOREFY_API_URL"
          [ -n "${{ secrets.BUILD_API_SECRET }}" ]   || faltando="$faltando BUILD_API_SECRET"
          [ -n "${{ secrets.EXPO_TOKEN }}" ]         || faltando="$faltando EXPO_TOKEN"
          [ -n "${{ secrets.EAS_WEBHOOK_SECRET }}" ] || faltando="$faltando EAS_WEBHOOK_SECRET"
          if [ -n "$faltando" ]; then
            echo "::error::Faltam segredos no repositório:$faltando"
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Buscar os dados da loja
        id: dados
        env:
          API: ${{ secrets.STOREFY_API_URL }}
          SEGREDO: ${{ secrets.BUILD_API_SECRET }}
          BUILD_ID: ${{ github.event.client_payload.buildId }}
        run: |
          # `--fail-with-body` para o corpo do erro aparecer no log; o corpo de
          # SUCESSO nunca é ecoado, porque traz a chave de publicação da loja.
          http=$(curl -sS -o /tmp/build.json -w '%{http_code}' \
            --fail-with-body \
            -X POST "$API/api/internal/build" \
            -H "Authorization: Bearer $SEGREDO" \
            -H 'Content-Type: application/json' \
            -d "{\"buildId\":\"$BUILD_ID\"}") || true

          if [ "$http" != "200" ]; then
            echo "::error::A Storefy não liberou os dados deste build (HTTP $http)."
            exit 1
          fi

          # Só o que NÃO é segredo sai para as variáveis de passo.
          {
            echo "store_id=$(jq -r '.storeId' /tmp/build.json)"
            echo "platform=$(jq -r '.platform' /tmp/build.json)"
            echo "profile=$(jq -r '.profile' /tmp/build.json)"
            echo "canal=$(jq -r '.canal' /tmp/build.json)"
            echo "nome=$(jq -r '.nomeDoApp' /tmp/build.json)"
            echo "cor=$(jq -r '.corDeFundo' /tmp/build.json)"
          } >> "$GITHUB_OUTPUT"

      - name: Avisar que começou
        env:
          API: ${{ secrets.STOREFY_API_URL }}
          SEGREDO: ${{ secrets.BUILD_API_SECRET }}
          BUILD_ID: ${{ github.event.client_payload.buildId }}
        run: |
          curl -sS -X POST "$API/api/internal/build/status" \
            -H "Authorization: Bearer $SEGREDO" \
            -H 'Content-Type: application/json' \
            -d "{\"buildId\":\"$BUILD_ID\",\"status\":\"building\"}" > /dev/null

      - name: Separar a config e os assets da loja
        env:
          STORE_ID: ${{ steps.dados.outputs.store_id }}
        run: |
          pasta="apps/mobile/brands/$STORE_ID"
          mkdir -p "$pasta"
          jq '.config' /tmp/build.json > "$pasta/config.json"

          # Sem a linha de `import` em `embutida.ts`, o Metro não empacota o
          # JSON acima: o app sairia sem config embutida, e o primeiro uso sem
          # internet abriria em erro.
          pnpm exec tsx apps/mobile/scripts/registrar-config-embutida.ts "$STORE_ID"

          # O ícone e a splash vêm por link ASSINADO, e não por caminho: o
          # bucket é privado, e dar ao runner a chave do Storage seria dar
          # acesso aos assets de todas as lojas.
          icone_url=$(jq -r '.urlDoIcone // empty' /tmp/build.json)
          if [ -z "$icone_url" ]; then
            echo "::error::Esta loja ainda não enviou o ícone do app."
            exit 1
          fi
          curl -sS --fail -o "$pasta/icon-original.png" "$icone_url"

          splash_url=$(jq -r '.urlDaSplash // empty' /tmp/build.json)
          if [ -n "$splash_url" ]; then
            curl -sS --fail -o "$pasta/splash-original.png" "$splash_url"
          fi

          # `pnpm assets` recusa o ícone que a Apple recusaria, aqui, em
          # segundos — em vez de a revisão recusar dias depois.
          pnpm assets \
            --icone="$pasta/icon-original.png" \
            --saida="$pasta" \
            --cor="${{ steps.dados.outputs.cor }}" \
            $( [ -f "$pasta/splash-original.png" ] && echo "--splash=$pasta/splash-original.png" )

          # Os originais saem do disco: o que o build usa são os gerados.
          rm -f "$pasta/icon-original.png" "$pasta/splash-original.png"

      # As credenciais da conta do LOJISTA vão para o disco do runner com
      # permissão 600, e saem no último passo. O `eas build` precisa delas para
      # gerar o certificado de distribuição sem ninguém digitar senha.
      - name: Escrever as credenciais no disco
        env:
          PLATFORM: ${{ steps.dados.outputs.platform }}
        run: |
          mkdir -p /tmp/cred && chmod 700 /tmp/cred
          jq -r '.credenciais.ascKey // empty' /tmp/build.json > /tmp/cred/asc.p8
          jq -r '.credenciais.googleServiceAccount // empty' /tmp/build.json > /tmp/cred/google.json
          chmod 600 /tmp/cred/* 2>/dev/null || true

          if [ "$PLATFORM" = "ios" ] && [ ! -s /tmp/cred/asc.p8 ]; then
            echo "::error::A conta Apple desta loja não está conectada."
            exit 1
          fi
          if [ "$PLATFORM" = "android" ] && [ ! -s /tmp/cred/google.json ]; then
            echo "::error::A conta Google desta loja não está conectada."
            exit 1
          fi

      # Primeira publicação de uma loja: o projeto dela ainda não existe no
      # Expo. O id criado aqui volta para `apps.expo_project_id`, senão a
      # próxima publicação criaria OUTRO projeto para a mesma loja.
      - name: Criar o projeto Expo da loja, se for a primeira vez
        id: projeto
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_OWNER: ${{ secrets.EXPO_OWNER }}
          STORE_ID: ${{ steps.dados.outputs.store_id }}
        working-directory: apps/mobile
        run: |
          atual=$(jq -r '.expoProjectId // empty' /tmp/build.json)
          if [ -n "$atual" ]; then
            echo "id=$atual" >> "$GITHUB_OUTPUT"
            echo "novo=nao" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # O SLUG É POR LOJA, e é o que separa um projeto EAS do outro: o EAS
          # acha o projeto pelo par dono + slug, e `app.config.ts` é um só para
          # todas as lojas. Sem esta linha, a segunda loja a publicar entraria
          # no projeto EAS da primeira e as duas passariam a dividir o canal de
          # update — uma correção OTA de uma chegaria no app da outra.
          export APP_SLUG=$(jq -r '.slug' /tmp/build.json)
          export APP_NAME=$(jq -r '.nomeDoApp' /tmp/build.json)
          export IOS_BUNDLE_ID=$(jq -r '.bundleIdIos // empty' /tmp/build.json)
          export ANDROID_PACKAGE=$(jq -r '.packageAndroid // empty' /tmp/build.json)

          pnpm dlx eas-cli@latest init --non-interactive || true

          # O id é extraído por FORMATO, e não por campo: `eas project:info`
          # imprime tabela numa versão do CLI e JSON noutra, e um uuid é a única
          # coisa com esta cara na saída dos dois.
          criado=$(pnpm dlx eas-cli@latest project:info 2>/dev/null \
            | grep -ioE '[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}' \
            | head -1)

          if [ -z "$criado" ]; then
            echo "::error::Esta loja ainda não tem projeto no Expo, e não foi possível criá-lo automaticamente. Crie o projeto na conta Expo da Storefy e grave o id em apps.expo_project_id."
            exit 1
          fi
          echo "id=$criado" >> "$GITHUB_OUTPUT"
          echo "novo=sim" >> "$GITHUB_OUTPUT"

      # O webhook de status do EAS é POR PROJETO, e cada loja tem o seu. Sem
      # este passo, o projeto criado acima geraria o binário e nunca avisaria:
      # `eas build --no-wait` devolve na hora, nenhum processo nosso fica
      # esperando, e quem fecha a linha de `builds` é o webhook. A tela do
      # lojista diria "gerando" para sempre, e o envio à loja nunca sairia.
      #
      # Roda a cada build, e não só na criação, de propósito: é idempotente,
      # custa uma chamada e conserta sozinho o projeto que ficou sem webhook.
      - name: Garantir o webhook de status neste projeto
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_OWNER: ${{ secrets.EXPO_OWNER }}
          API: ${{ secrets.STOREFY_API_URL }}
          SEGREDO_DO_WEBHOOK: ${{ secrets.EAS_WEBHOOK_SECRET }}
          STORE_ID: ${{ steps.dados.outputs.store_id }}
          PROJETO: ${{ steps.projeto.outputs.id }}
        working-directory: apps/mobile
        run: |
          export EAS_PROJECT_ID="$PROJETO"
          export APP_SLUG=$(jq -r '.slug' /tmp/build.json)
          export APP_NAME=$(jq -r '.nomeDoApp' /tmp/build.json)

          alvo="$API/api/webhooks/eas"

          # O EAS recusa segredo curto, e a mensagem dele não diz qual variável
          # está errada. Vale conferir aqui, com o nome do segredo na tela.
          if [ ${#SEGREDO_DO_WEBHOOK} -lt 16 ]; then
            echo "::error::EAS_WEBHOOK_SECRET precisa ter pelo menos 16 caracteres."
            exit 1
          fi

          # A busca é pelo TEXTO da URL: o formato do `webhook:list` mudou entre
          # versões do CLI, e a URL é a única coisa que aparece em todos eles.
          lista=$(pnpm dlx eas-cli@latest webhook:list --json --non-interactive 2>/dev/null \
            || pnpm dlx eas-cli@latest webhook:list 2>/dev/null \
            || true)

          if printf '%s' "$lista" | grep -qF "$alvo"; then
            echo "Webhook de status já registrado neste projeto."
            exit 0
          fi

          pnpm dlx eas-cli@latest webhook:create \
            --event BUILD \
            --url "$alvo" \
            --secret "$SEGREDO_DO_WEBHOOK" \
            --non-interactive

      - name: Gerar o binário
        id: eas
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_OWNER: ${{ secrets.EXPO_OWNER }}
          API: ${{ secrets.STOREFY_API_URL }}
          STORE_ID: ${{ steps.dados.outputs.store_id }}
          PLATFORM: ${{ steps.dados.outputs.platform }}
          PROFILE: ${{ steps.dados.outputs.profile }}
          SPLASH_BG: ${{ steps.dados.outputs.cor }}
        working-directory: apps/mobile
        run: |
          # Cada valor vai para o ambiente do processo, e não para a linha de
          # comando: `ps` mostra argumento, não mostra ambiente.
          export STOREFY_APP_ID=$(jq -r '.appId' /tmp/build.json)
          export ONESIGNAL_APP_ID=$(jq -r '.oneSignalAppId // empty' /tmp/build.json)
          export STOREFY_DEVICE_SECRET=$(jq -r '.deviceSecret // empty' /tmp/build.json)
          # Sem o segredo, o app sairia sem conseguir registrar o aparelho nem
          # mandar evento — e ninguém notaria até o primeiro push não chegar.
          # Foi assim que todos os builds saíram antes de a rota criá-lo.
          if [ -z "$STOREFY_DEVICE_SECRET" ]; then
            echo "::error::A Storefy não devolveu o segredo do app. O binário sairia sem falar com o servidor."
            exit 1
          fi
          # Ele vai para o `eas.json` logo abaixo (a EAS precisa dele para
          # embutir no binário). Mascarado, nenhuma ferramenta que imprima o
          # ambiente o deixa no log do GitHub.
          echo "::add-mask::$STOREFY_DEVICE_SECRET"
          export EAS_PROJECT_ID="${{ steps.projeto.outputs.id }}"
          export APP_SLUG=$(jq -r '.slug' /tmp/build.json)
          export APP_NAME=$(jq -r '.nomeDoApp' /tmp/build.json)
          export IOS_BUNDLE_ID=$(jq -r '.bundleIdIos // empty' /tmp/build.json)
          export ANDROID_PACKAGE=$(jq -r '.packageAndroid // empty' /tmp/build.json)

          # Versão e número reservados pelo banco para ESTE build. Sem eles
          # todo binário saía como 1.0.0 (1), e a segunda publicação de
          # qualquer loja era recusada pela Apple e pela Google.
          export APP_VERSION=$(jq -r '.versao' /tmp/build.json)
          export IOS_BUILD=$(jq -r '.numeroDoBuild' /tmp/build.json)
          export ANDROID_VC="$IOS_BUILD"

          # O domínio da loja (links universais), um esquema de URL por app e
          # a API que o app chama. Sem eles, todo app reclamava o domínio da
          # loja de desenvolvimento, dividia o esquema `storefy://` com os
          # outros e chamava um endereço fixo em vez do painel de verdade.
          export STORE_DOMAIN=$(jq -r '.dominioDaLoja // empty' /tmp/build.json)
          export APP_SCHEME=$(jq -r '.esquema' /tmp/build.json)
          export API_BASE="$API"

          # O `app.config.ts` é avaliado DE NOVO no servidor da EAS, e lá só
          # existem as variáveis do `env` do perfil (ou as cadastradas na EAS):
          # as exportadas acima ficam neste runner. Sem isto, o binário sairia
          # com o nome, o bundle e o domínio da loja de desenvolvimento.
          jq --arg perfil "$PROFILE" \
            --arg STORE_ID "$STORE_ID" \
            --arg APP_NAME "$APP_NAME" \
            --arg APP_SLUG "$APP_SLUG" \
            --arg APP_SCHEME "$APP_SCHEME" \
            --arg APP_VERSION "$APP_VERSION" \
            --arg IOS_BUILD "$IOS_BUILD" \
            --arg ANDROID_VC "$ANDROID_VC" \
            --arg EXPO_OWNER "$EXPO_OWNER" \
            --arg EAS_PROJECT_ID "$EAS_PROJECT_ID" \
            --arg IOS_BUNDLE_ID "$IOS_BUNDLE_ID" \
            --arg ANDROID_PACKAGE "$ANDROID_PACKAGE" \
            --arg STORE_DOMAIN "$STORE_DOMAIN" \
            --arg SPLASH_BG "$SPLASH_BG" \
            --arg STOREFY_APP_ID "$STOREFY_APP_ID" \
            --arg API_BASE "$API_BASE" \
            --arg ONESIGNAL_APP_ID "$ONESIGNAL_APP_ID" \
            --arg STOREFY_DEVICE_SECRET "$STOREFY_DEVICE_SECRET" \
            '.build[$perfil].env = ((.build[$perfil].env // {}) + ($ARGS.named | del(.perfil)))' \
            eas.json > eas.json.novo
          mv eas.json.novo eas.json

          # Os nomes abaixo são os que `eas.json` interpola com `$`.
          export EXPO_ASC_API_KEY_PATH=/tmp/cred/asc.p8
          export EXPO_ASC_KEY_ID=$(jq -r '.credenciais.ascKeyId // empty' /tmp/build.json)
          export EXPO_ASC_ISSUER_ID=$(jq -r '.credenciais.ascIssuerId // empty' /tmp/build.json)
          export EXPO_APPLE_TEAM_ID=$(jq -r '.credenciais.appleTeamId // empty' /tmp/build.json)
          export EXPO_GOOGLE_SERVICE_ACCOUNT_PATH=/tmp/cred/google.json

          saida=$(pnpm dlx eas-cli@latest build \
            --platform "$PLATFORM" \
            --profile "$PROFILE" \
            --channel "${{ steps.dados.outputs.canal }}" \
            --non-interactive --no-wait --json)

          echo "eas_build_id=$(echo "$saida" | jq -r '.[0].id')" >> "$GITHUB_OUTPUT"
          echo "logs_url=$(echo "$saida" | jq -r '.[0].buildDetailsPageUrl')" >> "$GITHUB_OUTPUT"

      - name: Avisar que o binário está a caminho
        if: success()
        env:
          API: ${{ secrets.STOREFY_API_URL }}
          SEGREDO: ${{ secrets.BUILD_API_SECRET }}
          BUILD_ID: ${{ github.event.client_payload.buildId }}
        run: |
          curl -sS -X POST "$API/api/internal/build/status" \
            -H "Authorization: Bearer $SEGREDO" \
            -H 'Content-Type: application/json' \
            -d "$(jq -n \
              --arg id "$BUILD_ID" \
              --arg eas "${{ steps.eas.outputs.eas_build_id }}" \
              --arg logs "${{ steps.eas.outputs.logs_url }}" \
              --arg projeto "${{ steps.projeto.outputs.novo == 'sim' && steps.projeto.outputs.id || '' }}" \
              '{buildId: $id, status: "building", easBuildId: $eas, logsUrl: $logs}
               + (if $projeto == "" then {} else {expoProjectId: $projeto} end)')" > /dev/null

      # `always()` com `failure()`: qualquer passo que quebre acima precisa
      # virar "falhou" na tela do lojista. Sem isto o build ficaria "gerando"
      # para sempre, e ele esperaria o dia inteiro por algo que já morreu.
      - name: Avisar que falhou
        if: failure()
        env:
          API: ${{ secrets.STOREFY_API_URL }}
          SEGREDO: ${{ secrets.BUILD_API_SECRET }}
          BUILD_ID: ${{ github.event.client_payload.buildId }}
        run: |
          curl -sS -X POST "$API/api/internal/build/status" \
            -H "Authorization: Bearer $SEGREDO" \
            -H 'Content-Type: application/json' \
            -d "$(jq -n \
              --arg id "$BUILD_ID" \
              --arg url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
              '{buildId: $id, status: "errored", logsUrl: $url, erro: "A geração do app não terminou. Nossa equipe já foi avisada."}')" > /dev/null || true

      - name: Limpar os segredos do disco
        if: always()
        run: rm -rf /tmp/build.json /tmp/cred
